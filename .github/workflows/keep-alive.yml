name: Keep Render App Alive

on:
  schedule:
    # 매 10분마다 실행 (Render는 보통 15분 미사용 시 슬립됨)
    - cron: '*/13 * * * *'
  workflow_dispatch: # 수동으로도 실행할 수 있게 함

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: |
          # Render 배포 주소 
          curl -s https://aid-project.onrender.com > /dev/null
          echo "Pinged the server successfully!"
